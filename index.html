<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Antrian Untuk Chat Choirul</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#ddd7d1;
      padding:20px;
    }

    .card{
      background:white;
      border-radius:25px;
      padding:25px;
      margin-bottom:30px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    .title{
      font-size:20px;
      font-weight:bold;
      color:#0c6157;
      margin-bottom:8px;
    }

    .subtitle{
      color:#777;
      margin-bottom:25px;
    }

    .row{
      display:flex;
      gap:15px;
      margin-bottom:20px;
    }

    .group{
      flex:1;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#444;
    }

    input, select{
      width:100%;
      padding:16px;
      border-radius:16px;
      border:3px solid #e5e5e5;
      font-size:16px;
      outline:none;
    }

    button{
      width:100%;
      border:none;
      padding:18px;
      border-radius:20px;
      font-size:22px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-add{
      background:#2fd15f;
      color:white;
      margin-top:10px;
    }

    .search{
      margin:20px 0;
    }

    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
      border-radius:10px;
    }

    thead{
      background:#0b665c;
      color:white;
    }

    th, td{
      padding:15px;
      text-align:left;
    }

    tbody{
      background:#f7f7f7;
    }

    .badge{
      background:#2fd15f;
      color:white;
      padding:8px 16px;
      border-radius:20px;
      float:right;
      font-weight:bold;
    }

    .loading{
      text-align:center;
      padding:30px;
      color:#777;
    }

    .wa-btn{
      background:#25D366;
      color:white;
      padding:10px 15px;
      border-radius:10px;
      text-decoration:none;
      font-size:14px;
      font-weight:bold;
      display:inline-block;
    }

  </style>
</head>

<body>

<!-- FORM -->
<div class="card">

  <div class="title">
    📋 Antrian Untuk Chat Choirul
  </div>

  <div class="subtitle">
    Tambah antrian lalu kirim balasan via WhatsApp
  </div>

  <div class="row">

    <div class="group">
      <label>Nama</label>

      <input
        type="text"
        id="nama"
        placeholder="Nama pelanggan"
      >
    </div>

    <div class="group">
      <label>Layanan</label>

      <select id="layanan">
        <option>💬 Chat Umum</option>
        <option>🔥 Prioritas</option>
        <option>📞 Konsultasi</option>
      </select>
    </div>

  </div>

  <div class="group">
    <label>No. WhatsApp</label>

    <input
      type="text"
      id="nohp"
      placeholder="08xxxxxxxxxx"
    >
  </div>

  <button class="btn-add" onclick="tambahAntrian()">
    + Tambah Antrian
  </button>

</div>


<!-- LIST -->
<div class="card">

  <div class="title">
    📋 Daftar Antrian
    <span class="badge" id="jumlahData">0</span>
  </div>

  <div class="search">

    <input
      type="text"
      placeholder="🔎 Cari nama..."
      onkeyup="cariData(this.value)"
    >

  </div>

  <table>

    <thead>
      <tr>
        <th>Nama</th>
        <th>Layanan</th>
        <th>Kirim</th>
      </tr>
    </thead>

    <tbody id="tbody">

      <tr>
        <td colspan="3" class="loading">
          Memuat data...
        </td>
      </tr>

    </tbody>

  </table>

</div>


<script>

const URL = "https://script.google.com/macros/s/AKfycbw-W0k_P84snIaEQTBGKMPgvhTKQa_EYcgtILJWMWyVocEkoOoHpv2uVgf4W8cWkA/exec";

let semuaData = [];



// LOAD DATA
async function loadData(){

  try{

    const response = await fetch(URL);

    const data = await response.json();

    semuaData = data;

    tampilkanData(data);

  }catch(error){

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="3" class="loading">
          Gagal memuat data 😢
        </td>
      </tr>
    `;

  }

}



// TAMPILKAN DATA
function tampilkanData(data){

  const tbody = document.getElementById("tbody");

  document.getElementById("jumlahData").innerText = data.length;

  if(data.length === 0){

    tbody.innerHTML = `
      <tr>
        <td colspan="3" class="loading">
          Belum ada antrian
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = "";

  data.reverse().forEach((item)=>{

    const nama = item.nama || "";
    const layanan = item.layanan || "";
    const nohp = item.nohp || "";

    const pesan = encodeURIComponent(
`Halo ${nama}

Antrian kamu untuk "${layanan}" sudah masuk 👍`
    );

    const wa = `https://wa.me/${nohp}?text=${pesan}`;

    tbody.innerHTML += `
      <tr>

        <td>${nama}</td>

        <td>${layanan}</td>

        <td>
          <a
            href="${wa}"
            target="_blank"
            class="wa-btn"
          >
            WhatsApp
          </a>
        </td>

      </tr>
    `;

  });

}



// TAMBAH DATA
async function tambahAntrian(){

  const nama = document.getElementById("nama").value;

  const layanan = document.getElementById("layanan").value;

  const nohp = document.getElementById("nohp").value;


  if(!nama || !nohp){

    alert("Isi semua data");
    return;
  }


  const formData = new FormData();

  formData.append("nama", nama);

  formData.append("layanan", layanan);

  formData.append("nohp", nohp);


  try{

    await fetch(URL, {

      method:"POST",

      body:formData

    });

    alert("Antrian berhasil ditambahkan");

    document.getElementById("nama").value = "";

    document.getElementById("nohp").value = "";

    loadData();

  }catch(error){

    alert("Gagal mengirim data");

  }

}



// SEARCH
function cariData(keyword){

  keyword = keyword.toLowerCase();

  const hasil = semuaData.filter(item => {

    return item.nama.toLowerCase().includes(keyword);

  });

  tampilkanData(hasil);

}



loadData();

</script>

</body>
</html>
